# Future deployment sketch (NOT required to run the prototype).
# The prototype runs with SQLite + local storage via scripts/run_dev.sh.
# This compose file shows the eventual hospital-server tier: PostgreSQL + Redis
# + MinIO + the API + the frontend. Build it out as the system matures (M6).
version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adaptive
      POSTGRES_PASSWORD: adaptive
      POSTGRES_DB: adaptivesurgeon
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: adaptive
      MINIO_ROOT_PASSWORD: adaptivesecret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  backend:
    build: ../backend
    environment:
      ADAPTIVE_DATABASE_URL: postgresql+psycopg2://adaptive:adaptive@postgres/adaptivesurgeon
      ADAPTIVE_STORAGE_BACKEND: s3
      ADAPTIVE_S3_ENDPOINT_URL: http://minio:9000
      ADAPTIVE_S3_ACCESS_KEY: adaptive
      ADAPTIVE_S3_SECRET_KEY: adaptivesecret
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]

  frontend:
    build: ../frontend
    environment:
      ADAPTIVE_BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["5173:5173"]

volumes:
  pgdata:
  miniodata:
